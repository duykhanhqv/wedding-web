<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thiệp Cưới | Duy Khánh &amp; Hồng Nhung</title>

<!-- Thứ tự nạp CSS có ý nghĩa: file sau đè được lên file trước.
     fonts    : tải font chữ
     base     : bảng màu, font, lớp dùng chung  ← đọc file này trước tiên
     sections : giao diện từng phần của thiệp
     envelope : bìa phong bì mở đầu
     reveal   : hiệu ứng ảnh bay vào khi cuộn -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sections.css">
<link rel="stylesheet" href="css/envelope.css">
<link rel="stylesheet" href="css/reveal.css">
</head>

<body>
<!-- ============================================================================
     BẢN ĐỒ THIỆP — trang này là HTML/CSS/JS thuần, không dùng framework nào.

     Mỗi phần bên dưới có một id riêng, và style của nó nằm đúng khối mang tên
     id đó trong css/sections.css.

       #sec-page-1     Ảnh thiệp trang 1 + tên viết tay Khánh & Nhung
       #sec-page-2     Ảnh thiệp trang 2
       #sec-countdown  Đếm ngược + nút thêm vào lịch      → js/countdown.js
       #sec-page-3     Ảnh thiệp trang 3
       #sec-album      Album cưới, lưới 2×2
       #sec-strip      Dải ảnh ( 01 )( 02 )( 03 )
       #sec-collage    Collage 3 ảnh xếp lệch
       #sec-layer      Ảnh lồng lớp
       #sec-wishes     Sổ lưu bút                          → js/wishes.js
       #sec-thanks     Cảm ơn

     Bìa phong bì mở đầu KHÔNG nằm trong file này: nó do js/envelope.js dựng ra,
     để mỗi khách mời thấy tên riêng của mình (đường dẫn ?k=<mã>).

     ĐỔI ẢNH: sửa thuộc tính src của thẻ <img> tương ứng, file ảnh để trong
     assets/img/. Mỗi ảnh luôn nằm trong một <div class="khung-anh"> — khung lo
     tỉ lệ, ảnh bên trong tự phủ kín (object-fit: cover).
     ========================================================================= -->

<main class="thiep">

  <!-- ══ #sec-page-1 · ẢNH THIỆP TRANG 1 + TÊN VIẾT TAY ══════════════════ -->
  <div id="sec-page-1" class="page-shot">
    <img src="assets/img/invite-1.png" alt="Thiệp mời — trang 1">
    <div class="hero-names">
      <span class="hn-name">Khánh</span>
      <span class="hn-amp">&amp;</span>
      <span class="hn-name">Nhung</span>
    </div>
  </div>

  <!-- ══ #sec-page-2 · ẢNH THIỆP TRANG 2 ═════════════════════════════════ -->
  <div id="sec-page-2" class="page-shot">
    <img src="assets/img/invite-2.png" alt="Thiệp mời — trang 2">
  </div>

  <!-- ══ #sec-countdown · ĐẾM NGƯỢC + NÚT THÊM VÀO LỊCH ══════════════════
       Bốn số do js/countdown.js điền vào mỗi giây; ngày cưới cũng khai báo
       trong file đó. -->
  <section id="sec-countdown">
    <p class="nhan-nho">Cùng đếm ngược</p>
    <div class="gach-ngan"></div>

    <div class="cd-grid">
      <div class="cd-cell">
        <div class="cd-num" data-dem="ngay">00</div>
        <div class="cd-label">Ngày</div>
      </div>
      <div class="cd-cell">
        <div class="cd-num" data-dem="gio">00</div>
        <div class="cd-label">Giờ</div>
      </div>
      <div class="cd-cell">
        <div class="cd-num" data-dem="phut">00</div>
        <div class="cd-label">Phút</div>
      </div>
      <div class="cd-cell">
        <div class="cd-num" data-dem="giay">00</div>
        <div class="cd-label">Giây</div>
      </div>
    </div>

    <p class="cd-date">14.11.2026 &nbsp;|&nbsp; 10:00 AM</p>

    <button type="button" class="nut" id="nut-them-lich">Thêm vào lịch</button>
  </section>

  <!-- ══ #sec-page-3 · ẢNH THIỆP TRANG 3 ═════════════════════════════════ -->
  <div id="sec-page-3" class="page-shot">
    <img src="assets/img/invite-3.png" alt="Thiệp mời — trang 3">
  </div>

  <!-- ══ #sec-album · ALBUM CƯỚI — lưới 2×2 ══════════════════════════════
       .album-rules là lớp hai đường kẻ chữ thập, nằm ĐÈ lên lưới ảnh. -->
  <section id="sec-album">
    <p class="nhan-nho">Album cưới</p>

    <div class="album-stage">
      <div class="album-rules">
        <span class="ke-ngang"></span>
        <span class="ke-doc"></span>
      </div>

      <div class="album-grid">
        <div class="album-cell">
          <div class="khung-anh">
            <!-- canh-duoi: ảnh này lấy phần dưới khung hình cho vừa mặt người -->
            <img src="assets/img/album-1.webp" alt="Ảnh cưới 1" class="canh-duoi">
          </div>
        </div>
        <div class="album-cell">
          <div class="khung-anh"><img src="assets/img/album-2.webp" alt="Ảnh cưới 2"></div>
        </div>
        <div class="album-cell">
          <div class="khung-anh"><img src="assets/img/album-3.webp" alt="Ảnh cưới 3"></div>
        </div>
        <div class="album-cell">
          <div class="khung-anh">
            <!-- canh-tren: ảnh này lấy phần trên khung hình -->
            <img src="assets/img/album-4.webp" alt="Ảnh cưới 4" class="canh-tren">
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ══ #sec-strip · DẢI ẢNH ( 01 )( 02 )( 03 ) ═════════════════════════
       Hai lớp ảnh chồng nhau: lớp 1 (ảnh 01–03) và lớp 2 (ảnh 04–06).
       data-hien="1" là lớp đang hiện, "0" là lớp đang ẩn — xem js/carousel.js. -->
  <section id="sec-strip">
    <div class="strip-stage">

      <!-- Lớp 1 — ảnh 01–03 -->
      <div class="strip-track lop-anh" data-lop="strip" data-hien="1">
        <figure class="strip-item">
          <div class="khung-anh"><img src="assets/img/strip-1.webp" alt="Khoảnh khắc 1"></div>
        </figure>
        <figure class="strip-item">
          <div class="khung-anh"><img src="assets/img/strip-2.webp" alt="Khoảnh khắc 2"></div>
        </figure>
        <figure class="strip-item">
          <div class="khung-anh"><img src="assets/img/strip-3.webp" alt="Khoảnh khắc 3"></div>
        </figure>
      </div>

      <!-- Lớp 2 — ảnh 04–06, CHƯA GÁN ẢNH.
           Thêm ảnh: thay <span class="chua-co-anh">…</span> bằng
           <img src="assets/img/strip-4.webp" alt="Khoảnh khắc 4"> -->
      <div class="strip-track lop-anh" data-lop="strip" data-hien="0">
        <figure class="strip-item">
          <figcaption>( 04 )</figcaption>
          <div class="khung-anh"><span class="chua-co-anh">Ảnh 4</span></div>
        </figure>
        <figure class="strip-item">
          <figcaption>( 05 )</figcaption>
          <div class="khung-anh"><span class="chua-co-anh">Ảnh 5</span></div>
        </figure>
        <figure class="strip-item">
          <figcaption>( 06 )</figcaption>
          <div class="khung-anh"><span class="chua-co-anh">Ảnh 6</span></div>
        </figure>
      </div>

    </div>
  </section>

  <!-- ══ #sec-collage · COLLAGE 3 ẢNH XẾP LỆCH ═══════════════════════════
       Vị trí ba ảnh (.anh-1/.anh-2/.anh-3) đặt trong css/sections.css. -->
  <section id="sec-collage">
    <div class="collage-stage">

      <!-- Lớp 1 — ảnh 01–03 -->
      <div class="collage-slide lop-anh" data-lop="collage" data-hien="1">
        <div class="khung-anh anh-1"><img src="assets/img/collage-1.webp" alt="Ảnh cưới"></div>
        <div class="khung-anh anh-2"><img src="assets/img/collage-2.webp" alt="Ảnh cưới"></div>
        <div class="khung-anh anh-3"><img src="assets/img/collage-3.webp" alt="Ảnh cưới"></div>
      </div>

      <!-- Lớp 2 — chưa gán ảnh -->
      <div class="collage-slide lop-anh" data-lop="collage" data-hien="0">
        <div class="khung-anh anh-1"><span class="chua-co-anh">Ảnh 4</span></div>
        <div class="khung-anh anh-2"><span class="chua-co-anh">Ảnh 5</span></div>
        <div class="khung-anh anh-3"><span class="chua-co-anh">Ảnh 6</span></div>
      </div>

    </div>
  </section>

  <!-- ══ #sec-layer · ẢNH LỒNG LỚP ═══════════════════════════════════════
       Ảnh nền trắng đen phủ kín + ảnh chính nổi ở giữa. -->
  <section id="sec-layer">
    <div class="layer-stage">

      <!-- Lớp 1 -->
      <div class="layer-slide lop-anh" data-lop="layer" data-hien="1">
        <div class="khung-anh anh-nen"><img src="assets/img/layer-bg.webp" alt=""></div>
        <div class="khung-anh anh-chinh"><img src="assets/img/layer-front.webp" alt="Ảnh cưới"></div>
      </div>

      <!-- Lớp 2 — chưa gán ảnh -->
      <div class="layer-slide lop-anh" data-lop="layer" data-hien="0">
        <div class="khung-anh anh-nen"><span class="chua-co-anh">Ảnh nền 2</span></div>
        <div class="khung-anh anh-chinh"><span class="chua-co-anh">Ảnh chính 2</span></div>
      </div>

    </div>
  </section>

  <!-- ══ #sec-wishes · SỔ LƯU BÚT ════════════════════════════════════════
       js/wishes.js đọc hai ô nhập rồi thêm lời chúc vào .wish-list. -->
  <section id="sec-wishes">
    <p class="nhan-nho">Sổ lưu bút</p>
    <h2>Gửi lời chúc tới cô dâu &amp; chú rể</h2>
    <div class="gach-ngan"></div>

    <div class="wish-form">
      <input type="text" id="wish-ten" placeholder="Tên của bạn">
      <textarea id="wish-loi" rows="4" placeholder="Lời chúc của bạn…"></textarea>
      <button type="button" class="nut" id="nut-gui-loi-chuc">Gửi lời chúc</button>
    </div>

    <!-- Lời chúc mới được js/wishes.js chèn lên ĐẦU danh sách này. -->
    <div class="wish-list" id="wish-list">
      <div class="wish-item">
        <div class="wish-name">Minh &amp; Trang</div>
        <div class="wish-msg">Chúc hai bạn trăm năm hạnh phúc, mãi bên nhau như ngày đầu.</div>
      </div>
    </div>
  </section>

  <!-- ══ #sec-thanks · CẢM ƠN ════════════════════════════════════════════ -->
  <section id="sec-thanks">
    <h2 class="thanks-title">Cảm Ơn</h2>
    <div class="gach-ngan"></div>
    <p class="loi-cuoi">Rất hân hạnh được đón tiếp</p>
  </section>

</main>

<!-- ============================================================================
     JAVASCRIPT — mỗi file lo đúng một việc, đặt cuối trang để HTML hiện trước.

       khach-moi.js  danh sách khách mời (chỉ là dữ liệu, sửa tên ở đây)
       envelope.js   dựng bìa phong bì và xử lý chạm mở
       countdown.js  đếm ngược + nút "Thêm vào lịch"
       carousel.js   đổi giữa hai lớp ảnh
       wishes.js     sổ lưu bút
       reveal.js     hiệu ứng ảnh bay vào khi cuộn tới

     Các file không phụ thuộc lẫn nhau (trừ envelope.js cần khach-moi.js nạp
     trước để đọc danh sách tên), nên bỏ bớt file nào thì chỉ mất đúng tính
     năng đó, phần còn lại vẫn chạy.
     ========================================================================= -->
<script src="js/khach-moi.js"></script>
<script src="js/envelope.js"></script>
<script src="js/countdown.js"></script>
<script src="js/carousel.js"></script>
<script src="js/wishes.js"></script>
<script src="js/reveal.js"></script>

</body>
</html>
