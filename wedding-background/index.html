<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>Background sao rơi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wedding-background" aria-label="Bầu trời sao dành cho lễ cưới">
      <div class="ambient-glow" aria-hidden="true"></div>
      <canvas id="star-canvas" aria-hidden="true"></canvas>
      <div class="vignette" aria-hidden="true"></div>

      <section class="wedding-copy" aria-label="Lễ thành hôn của Hồng Nhung và Duy Khánh">
        <div class="wedding-copy__eyebrow">
          <span aria-hidden="true"></span>
          <p>Lễ thành hôn</p>
          <span aria-hidden="true"></span>
        </div>

        <h1 class="couple-names">
          <span>Hồng Nhung</span>
          <span class="couple-names__join" aria-label="và">
            <span aria-hidden="true"></span>
            <span class="couple-names__ampersand">&amp;</span>
            <span aria-hidden="true"></span>
          </span>
          <span>Duy Khánh</span>
        </h1>

        <time class="wedding-date" datetime="2026-11-15">15 / 11 / 2026</time>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
