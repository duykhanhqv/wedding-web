<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>Lễ thành hôn Hồng Nhung &amp; Duy Khánh</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wedding-background">
      <canvas id="star-canvas" aria-hidden="true"></canvas>

      <section class="wedding-content" aria-labelledby="ceremony-heading couple-heading">
        <div class="ceremony-title">
          <span aria-hidden="true"></span>
          <p id="ceremony-heading">Lễ thành hôn</p>
          <span aria-hidden="true"></span>
        </div>

        <h1 class="couple" id="couple-heading">
          <span class="couple__name">Hồng Nhung</span>
          <span class="couple__connector">
            <span aria-hidden="true"></span>
            <span class="couple__ampersand" aria-hidden="true">&amp;</span>
            <span class="sr-only">và</span>
            <span aria-hidden="true"></span>
          </span>
          <span class="couple__name">Duy Khánh</span>
        </h1>

        <time class="ceremony-date" datetime="2026-11-15">15 / 11 / 2026</time>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
