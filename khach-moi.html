<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danh sách khách mời — Khánh &amp; Nhung</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
  /* Trang phụ trợ cho cô dâu chú rể, không phải cho khách xem. */
  :root{color-scheme:light}
  body{margin:0;background:#f2efe9;color:#3c2828;
       font:400 15px/1.6 Cormorant,Georgia,serif;padding:40px 20px 80px}
  .wrap{max-width:760px;margin:0 auto}
  h1{margin:0;font:300 34px/1.2 Cormorant,Georgia,serif;letter-spacing:.06em;
     text-transform:uppercase;color:#6d0f18}
  .sub{margin:14px 0 0;font:400 12px/1.7 'DM Mono',ui-monospace,monospace;
       letter-spacing:.06em;color:rgba(60,40,40,.75)}
  .sub code{background:#e7e3db;padding:2px 6px;border-radius:3px}
  table{width:100%;border-collapse:collapse;margin-top:34px}
  th{text-align:left;font:400 10.5px/1 'DM Mono',ui-monospace,monospace;
     letter-spacing:.2em;text-transform:uppercase;color:rgba(60,40,40,.6);
     padding:0 10px 12px 0;border-bottom:1px solid rgba(60,40,40,.2)}
  td{padding:14px 10px 14px 0;border-bottom:1px solid rgba(60,40,40,.12);
     vertical-align:middle}
  .ten{font:400 20px/1.3 Cormorant,Georgia,serif;color:#3c2828}
  .ma{font:400 12px/1 'DM Mono',ui-monospace,monospace;color:rgba(60,40,40,.7)}
  .lien-ket{font:400 11.5px/1.5 'DM Mono',ui-monospace,monospace;
            color:#6d0f18;word-break:break-all}
  .nut{appearance:none;cursor:pointer;background:transparent;color:#6d0f18;
       border:1px solid rgba(109,15,24,.45);padding:8px 14px;white-space:nowrap;
       font:500 10px/1 'DM Mono',ui-monospace,monospace;letter-spacing:.14em;
       text-transform:uppercase;transition:background .15s,color .15s}
  .nut:hover{background:#6d0f18;color:#f6efe4}
  .trong{margin-top:30px;padding:20px;background:#e7e3db;
         font:400 13px/1.7 'DM Mono',ui-monospace,monospace}
</style>
</head>
<body>
<div class="wrap">
  <h1>Danh sách khách mời</h1>
  <p class="sub">
    Thêm hoặc sửa tên trong file <code>js/khach-moi.js</code>, lưu lại rồi tải
    lại trang này. Bấm <b>Sao chép</b> để lấy đường dẫn riêng của từng người —
    khách mở đường dẫn đó sẽ thấy tên mình ngay trên bìa thiệp.
  </p>

  <div id="bang"></div>
</div>

<script src="js/khach-moi.js"></script>
<script>
(function () {
  var ds = window.KHACH_MOI || {};
  var ma = Object.keys(ds);
  var hop = document.getElementById('bang');

  if (!ma.length) {
    hop.className = 'trong';
    hop.textContent = 'Chưa có tên nào trong js/khach-moi.js.';
    return;
  }

  function duongDan(k) {
    return new URL('index.html?k=' + encodeURIComponent(k), location.href).href;
  }

  // Sao chép: navigator.clipboard không dùng được khi mở bằng file://
  // (không phải ngữ cảnh bảo mật), nên có sẵn cách chép cũ để dự phòng.
  function chep(chuoi, nut) {
    function xong() {
      var cu = nut.textContent;
      nut.textContent = 'Đã chép';
      setTimeout(function () { nut.textContent = cu; }, 1600);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(chuoi).then(xong, function () { chepCu(chuoi, xong); });
    } else {
      chepCu(chuoi, xong);
    }
  }
  function chepCu(chuoi, xong) {
    var o = document.createElement('textarea');
    o.value = chuoi;
    o.style.position = 'fixed';
    o.style.opacity = '0';
    document.body.appendChild(o);
    o.select();
    try { document.execCommand('copy'); xong(); } catch (e) {}
    o.remove();
  }

  var bang = document.createElement('table');
  var thead = document.createElement('thead');
  thead.innerHTML = '<tr><th>Tên trên bìa</th><th>Mã</th><th>Đường dẫn riêng</th><th></th></tr>';
  bang.appendChild(thead);

  var tbody = document.createElement('tbody');
  ma.forEach(function (k) {
    var url = duongDan(k);
    var tr = document.createElement('tr');

    var tdTen = document.createElement('td');
    tdTen.className = 'ten';
    tdTen.textContent = ds[k];

    var tdMa = document.createElement('td');
    tdMa.className = 'ma';
    tdMa.textContent = k;

    var tdLink = document.createElement('td');
    var a = document.createElement('a');
    a.className = 'lien-ket';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = url;
    tdLink.appendChild(a);

    var tdNut = document.createElement('td');
    var nut = document.createElement('button');
    nut.type = 'button';
    nut.className = 'nut';
    nut.textContent = 'Sao chép';
    nut.addEventListener('click', function () { chep(url, nut); });
    tdNut.appendChild(nut);

    tr.appendChild(tdTen); tr.appendChild(tdMa);
    tr.appendChild(tdLink); tr.appendChild(tdNut);
    tbody.appendChild(tr);
  });
  bang.appendChild(tbody);
  hop.appendChild(bang);
})();
</script>
</body></html>
